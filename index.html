/* No double-tap zoom (taps on the battle screen come quickly); pinch zoom still works */
html, body, button, a, input, select, summary { touch-action: manipulation; }
/* Layout: one centered column, a summit-night header band, cards only for Pokémon and the battle field. */
:root {
  --bg: #e9eef3; --panel: #ffffff; --panel2: #f3f6f9; --ink: #18212b; --muted: #5b6876; --line: #d3dbe3;
  --accent: #c8332f; --accent-ink: #ffffff; --band: #1c2733; --band-ink: #eef3f8; --snow: #f7fafc;
  --hp-g: #2f9e55; --hp-y: #d9a21b; --hp-r: #d4433c; --field1: #cfe0ec; --field2: #eef4f8;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-logo: "Anton", "Archivo Narrow", Impact, "Arial Narrow", sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151c; --panel: #17202a; --panel2: #1d2732; --ink: #e5ecf3; --muted: #93a2b2; --line: #2a3644;
  --accent: #e5534b; --accent-ink: #ffffff; --band: #0a0f15; --band-ink: #e5ecf3; --snow: #1b2531;
  --hp-g: #3fbf69; --hp-y: #e6b23a; --hp-r: #ec5b53; --field1: #1d2b38; --field2: #243443; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151c; --panel: #17202a; --panel2: #1d2732; --ink: #e5ecf3; --muted: #93a2b2; --line: #2a3644;
  --accent: #e5534b; --accent-ink: #ffffff; --band: #0a0f15; --band-ink: #e5ecf3; --snow: #1b2531;
  --hp-g: #3fbf69; --hp-y: #e6b23a; --hp-r: #ec5b53; --field1: #1d2b38; --field2: #243443; color-scheme: dark }

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 780px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { cursor: default; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

/* Header */
.top { background: transparent; color: var(--ink); }
.topin { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 8px 12px; padding-block: 14px 10px; border-bottom: 1.5px solid var(--line); }
.logo { font-family: var(--f-logo); font-size: 30px; font-weight: 400; letter-spacing: .01em; line-height: 1; margin-top: 2px; white-space: nowrap; }
.logo span { color: var(--accent); }
.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; min-width: 0; }
.dl { font-family: var(--f-display); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tabs { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 16px; }
.tabs button { white-space: nowrap; }
.tabs button { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 700; font-size: 14px; opacity: .65; }
.tabs button[aria-selected="true"] { opacity: 1; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }

main.wrap { padding-block: 16px 8px; display: flex; flex-direction: column; gap: 16px; }
.foot { font-size: 12px; color: var(--muted); padding-block: 8px 28px; }

/* Controls */
.controls { display: flex; gap: 12px 20px; flex-wrap: wrap; }
.ctl { display: flex; flex-direction: column; gap: 4px; }
/* Phones: Mode gets its own line, with Format and Red side by side underneath */
@media (max-width: 599px) {
  .controls > .ctl:first-child { flex-basis: 100%; align-items: flex-start; }
  /* Compact pills so Format and Red (three options) fit side by side */
  .controls { column-gap: 10px; }
  .controls .seg button { padding: 6px 8px; font-size: 13px; }
}
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled:not([aria-checked="true"]) { opacity: .45; }
.blurb { margin: -6px 0 0; color: var(--muted); font-size: 14px; max-width: 65ch; }

.today { display: grid; grid-template-columns: repeat(3, auto) 1fr; gap: 6px 22px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.today > div { display: flex; flex-direction: column; min-width: 0; }
.today b { font-size: 16px; }
.pips { flex-direction: row !important; gap: 4px; justify-content: flex-end; flex-wrap: wrap; }
.pip { box-sizing: border-box; width: 12px; height: 12px; border-radius: 3px; background: var(--line); }
.p-flaw { background: var(--hp-g); } .p-ff { background: transparent; border: 2px solid var(--muted); } .p-win { background: var(--hp-y); } .p-loss { background: var(--hp-r); }
@media (max-width: 520px) { .today { grid-template-columns: repeat(3, 1fr); } .pips { grid-column: 1 / -1; justify-content: flex-start; } }

/* Pre-battle */
.prebattle { background: linear-gradient(180deg, var(--field1), var(--field2)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.vs { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; }
.vsmon { display: flex; align-items: center; gap: 8px; }
.vsmon > div { display: flex; flex-direction: column; }
.vsmon b { font-family: var(--f-display); font-size: 20px; }
.vsx { font-family: var(--f-display); font-size: 18px; color: var(--muted); }
.go { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 12px 28px; font-weight: 700; font-size: 16px; box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.go:active { transform: translateY(1px); box-shadow: none; }
.note { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.ghost { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 14px; color: var(--ink); }
.ghost.warn { border-color: var(--accent); color: var(--accent); }

/* Blocks and team cards */
.block h2, details.block > summary h2 { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
details.block > summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; gap: 2px; }
details.block > summary::-webkit-details-marker { display: none; }
details.block > summary h2::after { content: " ▸"; color: var(--muted); font-size: 14px; }
details.block[open] > summary h2::after { content: " ▾"; }
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 10px; margin-top: 10px; }
.mon { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mon.is-lead { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.monh { display: flex; align-items: center; gap: 8px; }
.monid { flex: 1; min-width: 0; }
.monid h3 { font-size: 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gd { font-family: system-ui, sans-serif; font-weight: 700; margin-left: 4px; font-size: 1.05em; flex: none; }
.gd.m { color: #3a6ad6; } .gd.f { color: #d6456e; }
.pm .gd, .tc .gd { font-size: 1.15em; } .pm .gd.m, .tc .gd.m { color: #a9c6ff; } .pm .gd.f, .tc .gd.f { color: #ffb0c6; }
.sect { font-family: var(--f-display); font-size: 22px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--line); }
.leadtag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 1px 6px; border-radius: 4px; }
.types { display: flex; gap: 4px; margin-top: 3px; }
